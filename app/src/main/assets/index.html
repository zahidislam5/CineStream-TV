<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZAHRUS TV</title>
<style>
:root{font-family:Arial,"Helvetica Neue",sans-serif;font-size:19px;color:#f7f8fb;background:#0a0d15}
*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit;color:inherit}
button{background:#273047;border:0;border-radius:9px;padding:12px 16px;cursor:pointer}
button:focus,input:focus,select:focus{outline:4px solid white;outline-offset:3px;position:relative;z-index:4}
button:focus{transform:scale(1.04)}button:disabled{opacity:.36}
header{display:flex;align-items:center;flex-wrap:wrap;gap:14px;background:#111521;padding:18px 3.5%;position:sticky;top:0;z-index:8;border-bottom:1px solid #252b39}
.brand{font-size:28px;font-weight:900;white-space:nowrap;color:#ff5278;margin-right:15px}
nav{display:flex;gap:9px;flex-wrap:wrap}
nav button.selected{background:#dc3c60;color:white}
#search{margin-left:auto;width:265px;max-width:75vw;padding:12px 15px;background:#1a2232;border:2px solid #46566d;border-radius:9px}
#scan{background:#dc3c60;font-weight:bold}
#stop{display:none;background:#76334c}
#status{background:#121723;color:#bfc8db;padding:11px 3.5%;font-size:15px;min-height:43px}
#progress{display:none;padding:11px 3.5%;font-size:14px;color:#cbd5e4;background:#202534}
#progress.visible{display:block}
main{padding:25px 3.5% 80px}
.hero{padding:30px 36px;background:linear-gradient(110deg,#35263d,#172139 60%,#283143);border-radius:14px;margin:0 0 24px}
.hero h1{font-size:37px;margin:0 0 10px}
.hero p{font-size:17px;color:#ccd4e2;line-height:1.5;margin:0}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px;background:#161c2a;border:1px solid #313b4a;border-radius:11px;margin:20px 0}
.toolbar select{background:#272f42;border:1px solid #4a5367;padding:12px;border-radius:7px;max-width:260px}
.toolbar button{background:#343f51}
#categoryShortcuts{display:flex;overflow-x:auto;gap:9px;padding:8px 1px 19px;scrollbar-width:thin}
#categoryShortcuts button{white-space:nowrap;font-size:15px;background:#242d40;border:1px solid #374257}
h2{font-size:25px;margin:30px 0 15px}
.group h2{margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:17px}
.card{background:#1c2333;border:1px solid #354056;border-radius:12px;padding:0;overflow:hidden;text-align:left;min-height:320px}
.card:focus{box-shadow:0 10px 30px #000b}
.cover{height:200px;background:linear-gradient(150deg,#3c4e70,#373550 55%,#67304f);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .fallback{opacity:.6}
.card .info{padding:13px}
.card strong{display:block;font-size:17px;line-height:1.4;min-height:49px;overflow-wrap:anywhere}
.meta{font-size:14px;color:#b7c2d7;margin-top:7px}
.group{margin-bottom:36px}
.group .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
#pagination{display:flex;justify-content:center;align-items:center;gap:19px;margin:30px 0}
#pagination button{padding:13px 22px}
.empty{background:#1a2131;border-radius:11px;padding:32px;color:#afbdd1;line-height:1.5}
#titleBar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
#detail{display:none;position:fixed;z-index:20;inset:0;overflow:auto;background:#0a0d15;padding:5vh 7vw}
#detail.open{display:block}#detail h1{font-size:42px;margin:32px 0 13px}
#detail p{color:#c0ccda;font-size:18px;line-height:1.5}
#detail .actions{display:flex;gap:14px;flex-wrap:wrap;margin:26px 0 34px}
#detail .primary{background:#db365a}
#episodes{max-width:950px}
.episode{background:#191f2e;border:1px solid #344052;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 17px;margin:9px 0;border-radius:9px}
.episode button{white-space:nowrap}
@media(max-width:1150px){.grid,.group .grid{grid-template-columns:repeat(4,minmax(0,1fr))}#search{margin-left:0}}
@media(max-width:700px){.grid,.group .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:29px}.brand{font-size:24px}}
</style></head>
<body>
<header>
<div class="brand">▶ ZAHRUS TV</div>
<nav>
<button class="selected" data-tab="Home">Home</button>
<button data-tab="Movies">Movies</button>
<button data-tab="Series">Series</button>
<button data-tab="Latest">Latest</button>
<button data-tab="Favorites">Favorites</button>
</nav>
<input id="search" placeholder="Search title, year, episode…" aria-label="Search entire library" autocomplete="off">
<button id="scan">↻ Scan All</button>
<button id="stop">Pause Scan</button>
</header>
<div id="status">Loading the ZAHRUS TV library. Games and Software are excluded.</div>
<div id="progress"></div>
<main>
<div class="hero"><h1>Movies and Series. One screen.</h1>
<p>Browse your ISP movie library with the TV remote. One complete scan visits every reachable Movie and Series folder, and saves progress so you can resume later.</p></div>
<div id="categoryShortcuts" aria-label="Quick categories"></div>
<div id="toolbar" class="toolbar" style="display:none">
<select id="category" aria-label="Choose category"><option value="">All Categories</option></select>
<select id="year" aria-label="Choose release year"><option value="">All Years</option></select>
<select id="sort" aria-label="Sort results"><option value="new">Recently Added</option><option value="old">Oldest Added</option><option value="az">Title A–Z</option><option value="za">Title Z–A</option><option value="year">Release Year</option></select>
<button id="reset">Clear Filters</button>
</div>
<div id="content"></div>
<div id="pagination"></div>
</main>
<div id="detail"><button id="back">← Back</button><h1 id="detailTitle"></h1><p id="detailInfo"></p>
<div class="actions"><button class="primary" id="play">▶ Play</button>
<button id="fav">♡ Favorite</button><button id="external">External Player</button></div>
<h2 id="episodeTitle" style="display:none">Episodes</h2><div id="episodes"></div>
<button id="moreEpisodes" style="display:none">More Episodes</button>
</div>
<script>
(()=>{
// Android TV WebView versions before Chromium 86 do not support replaceChildren.
if(typeof Element!=="undefined" && !Element.prototype.replaceChildren){
  Element.prototype.replaceChildren=function(){
    while(this.firstChild)this.removeChild(this.firstChild);
    for(let i=0;i<arguments.length;i++){
      const child=arguments[i];
      this.appendChild(typeof child==="string"?document.createTextNode(child):child);
    }
  };
}
const $=id=>document.getElementById(id);
const st={tab:"Home",category:"",year:"",sort:"new",query:"",offset:0,total:0,request:0,items:[],groups:[],categories:[],years:[],detail:null,episodeOffset:0,episodeTotal:0};
let debounce=null,restoreFocus=null,scanning=false;
function nativeCall(name,...args){
 if(window.NativeTV&&typeof window.NativeTV[name]==="function")window.NativeTV[name](...args);
 else $("status").textContent="This action requires the Android TV application.";
}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function isPoster(url){
 try{const p=new URL(url);return p.protocol==="http:"&&["172.16.50.7","172.16.50.10","172.16.50.12","172.16.50.14"].includes(p.hostname)&&/\.(jpe?g|png|webp)$/i.test(p.pathname)}
 catch(e){return false}
}
function card(item){
 const b=el("button","card");b.dataset.id=item.id;
 const cover=el("div","cover");cover.append(el("span","fallback",item.kind==="Series"?"▣":"▶"));
 if(item.poster&&isPoster(item.poster)){
  const image=el("img");image.loading="lazy";image.alt="";image.decoding="async";
  image.src=item.poster;image.onerror=()=>image.remove();cover.append(image)
 }
 b.append(cover);
 const info=el("div","info");info.append(el("strong","",item.title));
 info.append(el("div","meta",item.kind+" · "+(item.year||item.category)+(item.favorite?" · ♥":"")));
 info.append(el("div","meta",item.category));b.append(info);
 b.onclick=()=>detail(item);return b
}
function grid(title,items){
 const wrapper=el("section","group");
 wrapper.append(el("h2","",title+" ("+items.length+")"));
 const g=el("div","grid");items.forEach(x=>g.append(card(x)));wrapper.append(g);return wrapper
}
function display(){
 const prior=document.activeElement?.dataset?.id;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("selected",b.dataset.tab===st.tab));
 $("content").replaceChildren();$("pagination").replaceChildren();
 const home=st.tab==="Home"&&!st.query&&!st.category&&!st.year;
 $("toolbar").style.display=home?"none":"flex";
 if(home){
  if(!st.groups.length)$("content").append(el("div","empty","Your library is empty. Connect to the ISP network and choose Scan All."));
  st.groups.forEach(g=>{if(g.items?.length)$("content").append(grid(g.title,g.items))});
 }else{
  const top=el("div","",null);top.id="titleBar";
  top.append(el("h2","",st.query?"Search Results":st.category||st.tab),el("span","meta",st.total+" titles"));
  $("content").append(top);
  if(!st.items.length)$("content").append(el("div","empty","No results yet. Try a different category, search term or scan your ISP library."));
  else $("content").append(grid("Results",st.items));
  if(st.total>48){
    const back=el("button","","← Previous");back.disabled=st.offset===0;
    back.onclick=()=>{st.offset=Math.max(0,st.offset-48);fetchBrowse()};
    const next=el("button","","Next →");next.disabled=st.offset+48>=st.total;
    next.onclick=()=>{st.offset+=48;fetchBrowse()};
    $("pagination").append(back,el("span","",String(st.offset+1)+"–"+Math.min(st.total,st.offset+48)+" / "+st.total),next)
  }
 }
 if(prior){const found=[...document.querySelectorAll(".card")].find(e=>e.dataset.id===prior);if(found)found.focus({preventScroll:true})}
}
function fetchBrowse(){
 st.request++;
 nativeCall("browse",st.tab,st.category,st.year,st.query,st.sort,st.offset,st.request);
}
function refresh(){
 if(st.tab==="Home"&&!st.query&&!st.category&&!st.year)nativeCall("home");
 else fetchBrowse()
}
function setTab(tab){
 st.tab=tab;st.category="";st.year="";st.offset=0;st.query="";$("search").value="";
 nativeCall("categories",tab);
 if(tab==="Home")nativeCall("home");else fetchBrowse();
 display()
}
function renderOptions(){
 const cat=$("category"),year=$("year");
 cat.replaceChildren(new Option("All Categories",""));
 st.categories.forEach(c=>cat.add(new Option(c.name+" ("+c.count+")",c.name)));
 cat.value=st.categories.some(c=>c.name===st.category)?st.category:"";st.category=cat.value;
 year.replaceChildren(new Option("All Years",""));
 st.years.forEach(y=>year.add(new Option(y,y)));
 year.value=st.years.includes(st.year)?st.year:"";st.year=year.value;
 $("sort").value=st.sort;
 const quick=$("categoryShortcuts");quick.replaceChildren();
 st.categories.slice(0,19).forEach(c=>{
  const b=el("button","",c.name+" · "+c.count);
  b.onclick=()=>{st.tab=c.name.toLowerCase().includes("series")?"Series":"Movies";st.category=c.name;st.query="";st.offset=0;$("search").value="";nativeCall("categories",st.tab);fetchBrowse();display()};
  quick.append(b)
 })
}
function detail(item){
 st.detail=item;restoreFocus=document.activeElement;
 $("detailTitle").textContent=item.title;
 $("detailInfo").textContent=[item.kind,item.category,item.year,item.genre,item.quality,item.size].filter(Boolean).join(" · ");
 $("play").onclick=()=>nativeCall("play",item.id);
 $("external").onclick=()=>nativeCall("external",item.id);
 $("fav").textContent=item.favorite?"♥ Remove Favorite":"♡ Favorite";
 $("fav").onclick=()=>{nativeCall("favorite",item.id,!item.favorite);item.favorite=!item.favorite;$("fav").textContent=item.favorite?"♥ Remove Favorite":"♡ Favorite"};
 $("episodes").replaceChildren();st.episodeOffset=0;st.episodeTotal=0;
 $("episodeTitle").style.display=item.kind==="Series"?"block":"none";
 $("moreEpisodes").style.display="none";
 if(item.kind==="Series")nativeCall("details",item.id,0);
 $("detail").classList.add("open");$("back").focus()
}
function appendEpisodes(payload){
 if(!st.detail||payload.id!==st.detail.id)return;
 st.episodeTotal=payload.total;st.episodeOffset=payload.offset+payload.episodes.length;
 payload.episodes.forEach(x=>{
  const row=el("div","episode");
  row.append(el("span","",(x.season?"S"+x.season+" · ":"")+(x.episode?"Episode "+x.episode:"Episode")+" · "+(x.quality||"")+" "+x.size));
  const b=el("button","","▶ Play");b.onclick=()=>nativeCall("play",x.id);
  row.append(b);$("episodes").append(row)
 });
 $("moreEpisodes").style.display=st.episodeOffset<st.episodeTotal?"block":"none";
}
function closeDetail(){
 if(!$("detail").classList.contains("open"))return false;
 $("detail").classList.remove("open");st.detail=null;
 if(restoreFocus?.isConnected)restoreFocus.focus();else document.querySelector(".card")?.focus();
 return true
}
window.tvBack=()=>{if(!closeDetail()){setTab("Home");document.querySelector('[data-tab="Home"]').focus()}};
window.fromNative=(type,data)=>{
 try{
  if(type==="home"){st.groups=JSON.parse(data);if(st.tab==="Home"&&!st.query)display()}
  else if(type==="categories"){
   const c=JSON.parse(data);
   if(st.tab===c.tab || st.tab==="Home"){st.categories=c.categories||[];st.years=c.years||[];renderOptions()}
  }else if(type==="browse"){
   const p=JSON.parse(data);
   if(p.requestId!==st.request)return;
   st.items=p.items||[];st.total=p.total||0;display();
  }else if(type==="details")appendEpisodes(JSON.parse(data));
  else if(type==="favorite"){
   const f=JSON.parse(data);st.items.forEach(x=>{if(x.id===f.id)x.favorite=f.value});
   st.groups.forEach(g=>(g.items||[]).forEach(x=>{if(x.id===f.id)x.favorite=f.value}));
  }else if(type==="progress"){
   const p=JSON.parse(data);scanning=!!p.scanning;
   $("progress").classList.add("visible");
   $("progress").textContent=(p.message||"")+"  ·  Indexed "+p.indexed+" files  ·  "+p.done+" folders scanned  ·  "+p.pending+" remaining  ·  "+p.failed+" unavailable";
   $("stop").style.display=scanning?"inline-block":"none";
  }else if(type==="status"||type==="complete")$("status").textContent=data;
  else if(type==="playback")refresh();
 }catch(e){$("status").textContent="Library display error: "+e.message}
};
document.querySelectorAll("nav [data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("category").onchange=e=>{st.category=e.target.value;st.offset=0;fetchBrowse()};
$("year").onchange=e=>{st.year=e.target.value;st.offset=0;fetchBrowse()};
$("sort").onchange=e=>{st.sort=e.target.value;st.offset=0;fetchBrowse()};
$("reset").onclick=()=>{st.category="";st.year="";st.sort="new";st.offset=0;renderOptions();fetchBrowse()};
$("search").oninput=e=>{
 st.query=e.target.value;st.offset=0;
 if(debounce)clearTimeout(debounce);
 debounce=setTimeout(()=>{if(st.query){$("toolbar").style.display="flex";fetchBrowse()}else refresh()},280);
};
$("scan").onclick=()=>{nativeCall("refresh");$("status").textContent="Scanning all reachable folders. You can continue browsing."};
$("stop").onclick=()=>nativeCall("stopScan");
$("back").onclick=closeDetail;
$("moreEpisodes").onclick=()=>{if(st.detail)nativeCall("details",st.detail.id,st.episodeOffset)};
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"||(e.key==="Backspace"&&document.activeElement.tagName!=="INPUT")){e.preventDefault();window.tvBack();return}
 if(!["ArrowRight","ArrowLeft","ArrowUp","ArrowDown"].includes(e.key))return;
 const a=document.activeElement;
 if(a.tagName==="SELECT"||a.tagName==="INPUT")return;
 const inside=$("detail").classList.contains("open");
 const nodes=[...document.querySelectorAll(inside?"#detail button:not(:disabled)":"header button:not(:disabled),header input,main button:not(:disabled),main select")].filter(n=>n.getClientRects().length);
 if(!nodes.includes(a))return;
 const r=a.getBoundingClientRect(),x=r.x+r.width/2,y=r.y+r.height/2,h=e.key==="ArrowLeft"||e.key==="ArrowRight";
 const candidates=nodes.filter(n=>n!==a).map(n=>{
  const b=n.getBoundingClientRect(),dx=b.x+b.width/2-x,dy=b.y+b.height/2-y;
  const along=e.key==="ArrowRight"?dx:e.key==="ArrowLeft"?-dx:e.key==="ArrowDown"?dy:-dy;
  return{n,along,score:along+(h?Math.abs(dy):Math.abs(dx))*2.8}
 }).filter(x=>x.along>6).sort((a,b)=>a.score-b.score);
 if(candidates[0]){e.preventDefault();candidates[0].n.focus();candidates[0].n.scrollIntoView({block:"nearest",inline:"nearest"})}
});
display();setTimeout(()=>nativeCall("ready"),300);
})();
</script>
</body></html>
