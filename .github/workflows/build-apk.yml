name: Build CineStream TV Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CineStreamTV-build-log
          path: build.log
          if-no-files-found: warn

      - name: Post build errors to a diagnostic issue
        if: steps.compile.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Android APK build failed. Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo 'The tail of the Gradle build log:'
            echo '~~~'
            tail -n 130 build.log | cut -c 1-240
            echo '~~~'
          } > /tmp/build-error.md
          gh issue create --title "CineStream TV APK build error (run ${{ github.run_number }})" --body-file /tmp/build-error.md

      - name: Fail job if compilation failed
        if: steps.compile.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: CineStreamTV-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
